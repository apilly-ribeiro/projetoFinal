<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <nav>
        <h1>Meu Portfólio</h1>

        <ul>
            <li><a href="index.html">Início</a></li>
            <li><a href="sobre.html">Sobre</a></li>
            <li><a href="contato.html">Contato</a></li>
        </ul>
    </nav>
</header>

<main>

<section class="pagina">

    <h2>Entre em Contato</h2>

    <form>

        <label for="nome">Nome</label>
        <input
            type="text"
            id="nome"
            required
            minlength="3"
        >

        <label for="email">Email</label>
        <input
            type="email"
            id="email"
            required
        >

        <label for="mensagem">Mensagem</label>

        <textarea
            id="mensagem"
            required
            minlength="10"
        ></textarea>

        <button type="submit">
            Enviar
        </button>

    </form>

</section>

</main>

<footer>
    <p>2026 • Projeto Académico</p>
</footer>

</body>
</html>
